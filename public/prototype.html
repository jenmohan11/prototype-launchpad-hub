<title>Launch Pad Project Page</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: roadmap strip, three-card header (project, pad status, settings), full-width Status Monitor, then Slack panel beside the Artifacts list. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#12202C; --muted:#586775; --line:#D3DAE1;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB;
  --crit:#B42626; --crit-soft:#FBE8E8; --warn:#8F5A00; --warn-soft:#FAEFD9; --ok:#18763F; --ok-soft:#DFF2E7;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1319; --surface:#151D25; --surface-2:#1B252F; --ink:#E5EBF0; --muted:#93A2B0; --line:#28343F;
    --accent:#7C9DFF; --accent-ink:#0B1220; --accent-soft:#1D2A4A;
    --crit:#FF8B8B; --crit-soft:#3A1F22; --warn:#F0B759; --warn-soft:#352A14; --ok:#63D08F; --ok-soft:#173022;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1319; --surface:#151D25; --surface-2:#1B252F; --ink:#E5EBF0; --muted:#93A2B0; --line:#28343F;
  --accent:#7C9DFF; --accent-ink:#0B1220; --accent-soft:#1D2A4A;
  --crit:#FF8B8B; --crit-soft:#3A1F22; --warn:#F0B759; --warn-soft:#352A14; --ok:#63D08F; --ok-soft:#173022;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-0.01em}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono)}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;font-weight:500;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ticks i{font-style:normal}
.ticks .ls{display:none}@media(max-width:600px){.ticks .lf{display:none}.ticks .ls{display:inline}}
.btn{text-decoration:none;display:inline-block;color:inherit}
a.btn:hover{text-decoration:underline}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ok{color:#08140D}}
:root[data-theme="dark"] .btn.ok{color:#08140D}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn.crit{color:var(--crit);border-color:var(--crit)}
.btn.small{padding:4px 9px;font-size:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
label{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
.field{display:flex;flex-direction:column;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;border-radius:99px;padding:2px 9px;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.blocker{color:var(--crit);background:var(--crit-soft);border-color:transparent}.pill.blocker::before{background:var(--crit)}
.pill.requirement_change{color:var(--accent);background:var(--accent-soft);border-color:transparent}.pill.requirement_change::before{background:var(--accent)}
.pill.milestone{color:var(--ok,#1a7f4b);background:var(--ok-soft,#e3f4ea);border-color:transparent}.pill.milestone::before{background:var(--ok,#1a7f4b)}
.pill.feedback{color:var(--warn);background:var(--warn-soft);border-color:transparent}.pill.feedback::before{background:var(--warn)}
.pill.comment{color:var(--muted)}
.pill.plain::before{display:none}
.pill.fresh{color:var(--ok);background:var(--ok-soft);border-color:transparent}.pill.fresh::before{background:var(--ok)}
.chip{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--surface-2);color:var(--muted)}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}

/* header */
.head{display:grid;grid-template-columns:1fr 1.5fr;gap:16px}
.proj h1{font-size:26px;line-height:1.1;margin:6px 0 10px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.meta dt{color:var(--muted)}.meta dd{margin:0;min-width:0}
.pad h2{margin-bottom:2px}
.track-wrap{position:relative;padding-top:30px;margin:10px 4px 0}
.marker{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:left .5s ease}
.marker b{font-family:var(--font-mono);font-size:12px;background:var(--ink);color:var(--bg);border-radius:5px;padding:1px 7px}
.marker i{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid var(--ink)}
.track{height:12px;border-radius:99px;background:linear-gradient(90deg,#D2402F 0%,#E8A317 50%,#2E9E5B 100%);position:relative}
.track::after{content:"";position:absolute;inset:0;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.ticks{position:relative;height:30px;margin-top:6px}
.ticks span{position:absolute;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.ticks span::before{content:"";position:absolute;top:-8px;left:50%;width:1px;height:6px;background:var(--line)}
.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
.ticks span:first-child::before{left:0}.ticks span:last-child::before{left:100%}
.note-small{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:none;padding:6px 10px;font-size:12.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}


/* top bar, project switcher, settings drawer */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.topbar-right{display:flex;gap:8px;flex-wrap:wrap}
.topbar-left{display:flex;align-items:center;gap:10px;min-width:0}
.brand{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-0.01em}
.sep{color:var(--line)}
.switcher{position:relative;min-width:0}
.switch-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:600;max-width:100%}
.switch-btn span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switch-btn svg{flex:none}
.menu{position:absolute;top:calc(100% + 6px);left:0;z-index:15;width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 12px 32px rgba(10,20,30,.18)}
.menu .eyebrow{display:block;padding:6px 10px 4px}
.menu-item{width:100%;text-align:left;border:0;background:none;border-radius:7px;padding:9px 10px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
.menu-item:hover{background:var(--surface-2)}
.menu-item[aria-current="true"]{background:var(--accent-soft)}
.menu-item .nm{font-weight:600}
.menu-item .sub{font-size:12px;color:var(--muted)}
.menu-item .stat{font-family:var(--font-mono);font-size:12px;text-align:right}
.set-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:500}
.set-btn small{color:var(--muted);font-size:12px}
.drawer-backdrop{position:fixed;inset:0;background:rgba(10,16,22,.5);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:31;overflow:auto;
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{position:fixed;z-index:31;left:50%;top:max(16px,env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(580px,calc(100vw - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.drawer section+section{margin-top:22px}
.drawer h3{margin-bottom:8px}

/* tables */
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
td.y{color:var(--ok);font-weight:600}td.n{color:var(--muted)}
.tablewrap{overflow-x:auto}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;align-items:baseline}

/* status monitor */
.monitor-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.summary{font-size:15.5px;line-height:1.55;max-width:80ch;margin:10px 0 14px}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.items{display:flex;flex-direction:column}
.item{border-bottom:1px solid var(--line)}
.item-top{width:100%;text-align:left;border:0;background:none;padding:12px 4px;display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:start}
.item-top:hover{background:var(--surface-2)}
.item-title{font-weight:600}
.item-sub{font-size:12.5px;color:var(--muted)}
.item-body{padding:4px 4px 18px 4px;display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
.item-body h4{font-family:var(--font-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:500}
.item-body ul{margin:0;padding-left:18px}
.item-body li{margin-bottom:4px}
.decision{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px}
.empty{padding:28px 8px;color:var(--muted)}
.run{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 12px;margin-top:12px;font-family:var(--font-mono);font-size:12px}
.run li{padding:2px 0}
.run .sim{color:var(--muted)}
.run .mode{margin-top:6px;color:var(--muted)}
details>summary{cursor:pointer;color:var(--muted);font-size:12.5px}
blockquote{margin:6px 0 0;padding:8px 10px;border-left:2px solid var(--line);color:var(--muted);font-size:13px;background:var(--surface-2);border-radius:0 6px 6px 0}

/* lower */
.lower{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;align-items:start}
.slack h2{margin-bottom:2px}
.chan{padding:12px 0;border-top:1px solid var(--line)}
.chan:first-of-type{border-top:0}
.chan-name{font-family:var(--font-mono);font-weight:500;font-size:13px}
.next{margin-top:6px;font-size:13px}
.next b{font-weight:600}
.art{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-top:8px}
.art>button{width:100%;text-align:left;border:0;background:none;padding:11px 14px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.art>button span:first-child{font-weight:600}
.art-body{padding:2px 14px 16px;border-top:1px solid var(--line)}
.art-body>*+*{margin-top:12px}
.art-body:first-child{padding-top:14px}
.req{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:baseline}
.req .mono{color:var(--muted);font-size:12px;flex:none}
.log{padding:10px 0;border-bottom:1px solid var(--line)}
.log-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{z-index:40;position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;max-width:min(560px,calc(100vw - 32px))}
@media (max-width:980px){
  .head{grid-template-columns:1fr}
  .lower{grid-template-columns:1fr}
  .item-body{grid-template-columns:1fr}
}
@media (max-width:560px){
  .grid2{grid-template-columns:1fr}
  .item-top{grid-template-columns:1fr auto}
  .item-top .pill{grid-column:1 / -1;justify-self:start}
  .proj h1{font-size:23px}
}
@media (prefers-reduced-motion:reduce){.marker{transition:none}}
</style>

<div class="wrap">
  <nav class="topbar" id="sec-nav" aria-label="Project navigation"></nav>

  <header class="head">
    <section class="panel proj" id="sec-project"></section>
    <section class="panel pad" id="sec-progress"></section>
  </header>

  <section class="panel" id="sec-monitor"></section>

  <div class="lower">
    <section class="panel slack" id="sec-slack"></section>
    <section class="panel" id="sec-artifacts"></section>
  </div>
</div>
<div id="sec-drawer"></div>
<div id="sec-modal"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
  var KEY='launchpad-proto-v3';
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var $=function(s){return document.querySelector(s)};
  var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
  var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtDay(s){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m? MONTHS[+m[2]-1]+' '+(+m[3])+', '+m[1] : (s||''); }
  function fmtStamp(iso){ try{ var d=new Date(iso); return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }catch(e){ return iso; } }
  function slug(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
  function ymd(s){ return String(s||'').replace(/-/g,'').slice(0,8); }
  function plural(n,one,many){ return n+' '+(n===1?one:(many||one+'s')); }

  var TYPE_LABEL={blocker:'Blocker',requirement_change:'Requirement change',feedback:'Feedback card',comment:'Comment',milestone:'Milestone'};
  var TYPE_ORDER={blocker:0,milestone:0.5,requirement_change:1,feedback:2,comment:3};
  var PRIO_ORDER={high:0,medium:1,low:2};
  var SECTIONS=['Summary','Next Steps','Requirements','Statement of Value','Stakeholder Feedback','Risks & Blockers','Timeline','Jira','Slack'];
  var PERSONAS={admin:'Admin (PM)',dev:'Dev',business:'Business'};

  var SAMPLE_NOTE={
    title:'Reporting Manager weekly sync', date:'2026-10-08',
    text:'Reporting Manager weekly sync, Oct 8 2026. Attendees: PM, dev lead, data lead, sales lead, client manager.\n\nPM: The client manager says Client B needs scheduled reports by the end of October, so I want to pull the beta forward to Oct 28.\n\nDev lead: That is tight. The builder and email scheduling work, but PDF export is not ready. We could run the beta with CSV only.\n\nData lead: Queries over 90 days still time out. We should cap custom date ranges at 90 days for the beta.\n\nSales lead: Clients also want to filter a report by campaign. That can wait until after the beta if we have to.\n\nClient manager: Please add a read-only share link so Client B can show reports to its executives.\n\nPM: Agreed on Oct 28 as a proposal. Dev lead, please confirm by Friday whether Oct 28 is realistic.'
  };

  function seedRM(){
    return {
      id:'rm', progress:20, reqDone:false, protoLocked:false,
      project:{name:'Reporting Manager', pm:'Jen Mohan', sprint:'Sprint 4 · Oct 5 to Oct 23, 2026', jira:'SCRUM'},
      stakeholders:[
        {name:'Jen Mohan', role:'admin'},{name:'Dev lead', role:'dev'},{name:'Data lead', role:'dev'},{name:'Sales lead', role:'business'},{name:'Client manager', role:'business'}
      ],
      items:[
        {key:'scrum-jira-comment-90-day-timeouts-20261014', title:'Reporting API times out on date ranges over 90 days', source:'Jira Comment', by:'Dev lead', date:'2026-10-14', type:'blocker', priority:'high',
          points:['Queries over 90 days exceed the 30-second gateway limit.','Scheduled quarterly reports fail until this is fixed.','The data team proposed pre-aggregated tables but has not given a date.'],
          raw:'Any range past 90 days returns a gateway timeout. Quarterly schedules fail every run. Data team says pre-aggregation is the fix but is not scheduled.',
          affected:['Jira','Timeline'], change:'Add a blocker and cap custom date ranges at 90 days for the beta unless the data team commits to pre-aggregation by Oct 20.',
          impact:'Quarterly reports cannot ship in the beta; reports up to 90 days are unaffected.', reason:'Blocks a headline feature and has no committed date.', status:'pending'},
        {key:'scrum-meeting-notes-legal-export-review-20261001', title:'CSV and PDF export is on hold for a legal review of data fields', source:'Meeting Notes', by:'Product ops', date:'2026-10-01', type:'blocker', priority:'medium', noteId:'n1',
          points:['Legal must review which customer data fields can appear in exports.','The review date was not confirmed in the meeting.'],
          raw:'Legal needs to review which customer data fields appear in exports before we ship CSV or PDF. They have not given us a date.',
          affected:['Requirements','Risks & Blockers'], change:'Add a blocker: exports held pending legal field review (date unconfirmed).',
          impact:'Exports may miss the beta; the builder and scheduling are unaffected.', reason:'Date is unconfirmed, so no one owns the follow-up.', status:'pending'},
        {key:'scrum-feedback-card-cm3-slack-delivery-20261013', title:'CM #3 wants scheduled reports delivered to Slack as well as email', source:'Feedback Card', by:'Client manager #3', date:'2026-10-13', type:'requirement_change', priority:'high', clients:'Client A, Client C', cardId:'c1',
          points:['Schedules should be able to post to a Slack channel.','Client A and Client C do not read report emails.','They want the PDF attached to the Slack post.'],
          raw:'Client A and Client C do not read report emails. Please let schedules post to a Slack channel with the PDF attached.',
          affected:['Requirements','Stakeholder Feedback'], change:'Add requirement: scheduled reports can be delivered to a Slack channel in addition to email.',
          impact:'Adds a Slack delivery integration that may not fit the beta; two named clients depend on it.', reason:'A change to requirements that affects two named clients.', status:'pending'},
        {key:'scrum-feedback-card-sample-gallery-20261012', title:'Sales asks for a gallery of sample reports', source:'Feedback Card', by:'Sales lead', date:'2026-10-12', type:'feedback', priority:'medium', clients:'', cardId:'c2',
          points:['Sales wants three ready-made sample reports to show in demos.','They would use them in client calls before the beta.'],
          raw:'Can we get three sample reports in a gallery? Sales needs something to show in demos.',
          affected:['Stakeholder Feedback'], change:'Add to backlog: sample report gallery in Prototype and Design (after the beta unless the PM decides otherwise).',
          impact:'Small addition; no effect on this sprint if deferred.', reason:'Request from sales with no deadline attached.', status:'pending'},
        {key:'scrum-jira-comment-default-time-zone-20261011', title:'Clarify the default time zone for scheduled reports', source:'Jira Comment', by:'Dev lead', date:'2026-10-11', type:'comment', priority:'low',
          points:['Schedules do not say which time zone they use.'],
          raw:'Which time zone does a 9am Monday schedule use? Account or viewer?',
          affected:['Requirements'], change:'Add requirement: schedules use the account time zone by default and can be changed per schedule.', impact:'Prevents reports arriving at the wrong hour.', reason:'Open question from dev.', status:'pending'},
        {key:'scrum-prototype-feedback-column-picker-20261015', title:'The column picker is hard to find on a phone', source:'Prototype Feedback', by:'Sales lead', date:'2026-10-15', type:'comment', priority:'low',
          points:['The column picker sits below the fold on small screens.'],
          raw:'On my phone I could not find where to add columns.',
          affected:['Next Steps'], change:'Move the column picker to a sticky bar on small screens.', impact:'Mobile usability of the report builder.', reason:'Prototype feedback from a business stakeholder.', status:'pending'},
        {key:'scrum-slack-rename-dimensions-20261015', title:'Rename "Dimensions" to a label customers recognize', source:'Slack', by:'Client manager', date:'2026-10-15', type:'comment', priority:'low',

  function decide(key,decision){
    var it=S.items.find(function(i){return i.key===key});
    if(!it||!can.approve()||it.status!=='pending') return;
    var note=(ui.drafts['note:'+key]||'').trim(); if(!note) return;
    it.status={accept:'accepted',reject:'rejected',delay:'delayed'}[decision];
    it.decision_notes=note; it.decided_by=S.project.pm; it.decided_at=new Date().toISOString();
    var fx=[];
    if(decision==='accept'&&it.type==='milestone'){
      var b0=S.progress; S.reqDraft=true; S.progress=Math.max(S.progress,35); it.undo={dp:S.progress-b0,reqDraft:true};
      fx.push('Pad status: Reqs draft done'+(S.progress!==b0?' (progress '+b0+'% to '+S.progress+'%)':''),'Summary regenerated');
    } else if(decision==='accept'){
      var cap=S.reqDone?95:49;
      if(S.progress<cap){ var b=S.progress; S.progress=Math.min(cap,S.progress+5); it.undo=it.undo||{}; it.undo.dp=S.progress-b; fx.push('Progress '+b+'% to '+S.progress+'%'); }
      if(it.affected.indexOf('Requirements')>-1){ S.requirements.push({id:'R-'+(S.requirements.length+1),text:it.change,from:it.key,sync:'queued'}); it.undo=it.undo||{}; it.undo.req=true; fx.push('Requirement added, Confluence write-back queued'); }
      if(it.affected.indexOf('Jira')>-1) fx.push('Jira update queued');
      if(it.affected.indexOf('Timeline')>-1) fx.push('Timeline update queued');
      if(it.affected.indexOf('Stakeholder Feedback')>-1) fx.push('Feedback card marked reviewed');
      fx.push('Summary regenerated');
    }
    logEntry({kind:decision,title:it.title,note:note,effects:fx,key:key});
    delete ui.drafts['note:'+key]; delete ui.fresh[key]; ui.expanded=null;
    save(); renderAll();
    toast(({accept:'Accepted. ',reject:'Rejected. ',delay:'Delayed. '})[decision]+(fx.length?fx.join('; ')+'.':'Logged in the Change Log.'));
    if(nconnected()) nDecision(it,it.status);
  }

  function cleanProposal(p,def){
    var types=['blocker','requirement_change','feedback','comment'];
    var arr=function(v){ return Array.isArray(v)? v.map(String).filter(Boolean) : (v? [String(v)]:[]); };
    return {
      title:String(p.title||'Update from '+def.source).slice(0,140),
      type:types.indexOf(p.item_type)>-1?p.item_type:def.type,
      points:arr(p.key_points).slice(0,5), raw:String(p.raw_text||'').slice(0,600),
      affected:arr(p.affected_sections).filter(function(s){return SECTIONS.indexOf(s)>-1}),
      change:String(p.proposed_change||'Review and decide.'), impact:String(p.impact||'Not assessed.'),
      priority:['high','medium','low'].indexOf(p.priority)>-1?p.priority:'medium', reason:String(p.attention_reason||'')
    };
  }
  async function extractLive(sample,inp){
    var prompt='You are the Orchestrator Agent for a product-management dashboard. Read the input below and PROPOSE action items for the project manager to approve. You never make changes, you only propose. Do not invent facts, owners or dates; if something is unclear, say so in attention_reason.\n\n'+
      'Reply with only a JSON array of 1 to 3 objects. Each object has: title (short and specific), item_type (one of "blocker","requirement_change","feedback","comment"), key_points (array of 2 to 4 one-sentence strings), raw_text (a short verbatim excerpt from the input), affected_sections (array chosen from '+JSON.stringify(SECTIONS)+'), proposed_change (the concrete update that would apply if accepted), impact (one sentence on goal, scope, timeline or users), priority ("high","medium" or "low"), attention_reason (one sentence on why the PM should look).\n\n'+
      'Source type: '+inp.source+'\nTitle: '+inp.title+'\nDate: '+inp.date+'\nSubmitted by: '+inp.by+(inp.clients?'\nClients named: '+inp.clients:'')+'\n\nInput:\n'+inp.text.slice(0,12000);
    var res=await sample.json(prompt,{modelTier:'quick'});
    if(!Array.isArray(res)) res=(res&&Array.isArray(res.items))?res.items:[res];
    res=res.filter(function(r){return r&&typeof r==='object'&&r.title}).slice(0,3);
    if(!res.length) throw {code:'invalid_json'};
    return res.map(function(r){return cleanProposal(r,inp)});
  }
  function sentences(t){ return t.replace(/\s+/g,' ').split(/(?<=[.!?])\s+/).map(function(s){return s.trim()}).filter(function(s){return s.length>25}); }
  function extractLocal(inp){
    var ss=sentences(inp.text);
    var hit=ss.filter(function(s){return /deadline|by (the )?(end|friday|monday|oct|nov)|\b(oct|nov|dec)\w* \d+|need|should|please|add |require|blocked|cannot|not ready|tight/i.test(s)});
    var pts=(hit.length?hit:ss).slice(0,4).map(function(s){return s.replace(/^[A-Za-z ]{2,24}:\s*/,'').slice(0,170)});
    var blocked=/blocked|cannot|not ready|blocker/i.test(inp.text);
    var t=inp.type;
    if(inp.source==='Meeting Notes') t=blocked&&!/requirement|add /i.test(inp.text)?'blocker':'requirement_change';
    var aff=[]; if(/requirement|add |tab|view/i.test(inp.text)) aff.push('Requirements'); if(/deadline|demo|oct|nov|date|friday/i.test(inp.text)) aff.push('Timeline'); if(/jira/i.test(inp.text)) aff.push('Jira'); if(!aff.length) aff.push(inp.source==='Feedback Card'?'Stakeholder Feedback':'Summary');
    var title=inp.source==='Meeting Notes'? 'Updates from "'+inp.title+'"' : (ss[0]||inp.text).slice(0,80);
    return [cleanProposal({title:title,item_type:t,key_points:pts,raw_text:(hit[0]||ss[0]||inp.text).slice(0,400),affected_sections:aff,proposed_change:'Review these points and update '+aff.join(', ')+' if accepted.',impact:'Keyword-based guess; not assessed by the model.',priority:blocked?'high':'medium',attention_reason:'Found by the scripted fallback, so check the raw text.'},inp)];
  }
  async function runAgent(inp){
    if(ui.run&&ui.run.active) return null;
    if(nconnected()&&!inp.local) return nRemoteRun(inp);
    ui.run={active:true,lines:[],mode:'',title:inp.title};
    var push=function(t,sim){ ui.run.lines.push({t:t,sim:!!sim}); renderMonitor(); renderArtifacts(); };
    push('Orchestrator Agent received '+inp.source.toLowerCase()+' "'+inp.title+'"');
    await sleep(500);
    push('Jira Agent (read-only): looked for related SCRUM issues',true); await sleep(500);
    push('Slack Agent (read-only): scanned '+((S.slack&&S.slack[0])?S.slack[0].n:'the project channel')+' for related threads',true); await sleep(500);
    push('get_pending_action_items: '+pending().length+' pending, checking for duplicates');
    var props, mode;
    try{
      var sample=await getSample(); if(!sample) throw {code:'absent'};
      props=await extractLive(sample,inp); mode='Claude (live)';
    }catch(e){
      props=extractLocal(inp);
      mode='Scripted fallback ('+(e&&e.code==='absent'?'Claude not available in this view':(e&&e.code==='not_granted'?'Claude access was not allowed':'Claude call did not return usable JSON'))+')';
    }

    var linkedAll=inp.cardId?S.items.filter(function(x){return x.cardId===inp.cardId&&x.status==='pending'}):[];
    if(linkedAll.length) props=props.slice(0,linkedAll.length);
    props.forEach(function(p,i){
      var linked=linkedAll[i];
      if(linked){
        linked.title=p.title; linked.type=p.type; linked.priority=p.priority; linked.points=p.points; linked.raw=p.raw; linked.change=p.change; linked.impact=p.impact; linked.reason=p.reason; linked.clients=inp.clients||'';
        p.affected.forEach(function(s){ if(linked.affected.indexOf(s)<0) linked.affected.push(s); });
        push('update_pending_action_item: '+linked.key+' (card was edited)');
        ui.fresh[linked.key]=true; keys.push(linked.key); return;
      }
      var key='scrum-'+slug(inp.source)+'-'+slug(p.title).slice(0,28)+'-'+ymd(inp.date)+'-'+(i+1);
      var ex=S.items.find(function(x){return x.key===key&&x.status==='pending'});
      if(ex){

        ex.raw=(ex.raw+'\n'+p.raw).slice(0,900);
        push('update_pending_action_item: '+key+' (merged into existing pending item)');
      } else {
        S.items.unshift({key:key,project_key:'SCRUM',title:p.title,source:inp.source,by:inp.by,date:inp.date,type:p.type,priority:p.priority,points:p.points,raw:p.raw,affected:p.affected,change:p.change,impact:p.impact,reason:p.reason,clients:inp.clients||'',cardId:inp.cardId,status:'pending',created:new Date().toISOString()});
        push('create_action_item: '+p.title+' (status pending)');
      }
      ui.fresh[key]=true; keys.push(key);
    });
    ui.run.mode=mode; push('Done. '+plural(keys.length,'item')+' waiting for the PM. Nothing on the page changed.');
    ui.run.active=false; ui.tab='pending'; ui.filter='all';
    save(); renderAll();

  }

    else if(act==='toggle-item'){ ui.expanded=(ui.expanded===key)?null:key; renderMonitor(); }
    else if(act==='toggle-section'){ var it=S.items.find(function(i){return i.key===key}); if(it&&can.approve()){ var ix=it.affected.indexOf(v); if(ix>-1) it.affected.splice(ix,1); else it.affected.push(v); save(); renderMonitor(); } }
    else if(act==='open-raw'){
      var it2=S.items.find(function(i){return i.key===key}); if(!it2) return;
      var map={'Meeting Notes':'meetings','Feedback Card':'feedback','Prototype Feedback':'prototype','Jira Comment':'req','Requirements Doc':'req','Confluence':'req'};
      if(it2.source==='Slack'){ $('#sec-slack').scrollIntoView({block:'center'}); return; }
      var id=map[it2.source]; ui.open[id]=true; if(id==='feedback') ui.fbTab=(S.cards.find(function(c){return c.id===it2.cardId})||{audience:'internal'}).audience; renderArtifacts(); var t=$('#art-'+id); if(t) t.scrollIntoView({block:'center'});
    }
    else if(act==='art'){ ui.open[a.dataset.id]=!ui.open[a.dataset.id]; renderArtifacts(); }
    else if(act==='fbtab'){ ui.fbTab=v; renderArtifacts(); }
    else if(act==='reopen'){ var r=S.items.find(function(i){return i.key===key}); if(r&&can.approve()){ var was=r.status, fx2=[]; if(was==='accepted'&&r.undo){ if(r.undo.dp){ S.progress=Math.max(0,S.progress-r.undo.dp); fx2.push('Progress back to '+S.progress+'%'); } if(r.undo.reqDraft){ S.reqDraft=false; fx2.push('Reqs draft done undone'); } if(r.undo.req){ S.requirements=S.requirements.filter(function(q){return q.from!==r.key}); fx2.push('Requirement removed'); } } delete r.undo; r.status='pending'; delete r.decision_notes; delete r.decided_by; delete r.decided_at; if(nconnected()) nDecision(r,'pending'); logEntry({kind:'reopen',title:r.title,note:(was==='delayed'?'Moved back to needs attention.':'Decision changed: was '+was+', moved back for a new decision.'),effects:fx2}); ui.tab='pending'; ui.expanded=r.key; save(); renderAll(); } }
    else if(act==='sample-note'){ ui.drafts.mnTitle=SAMPLE_NOTE.title; ui.drafts.mnDate=SAMPLE_NOTE.date; ui.drafts.mnText=SAMPLE_NOTE.text; renderArtifacts(); }
    else if(act==='sim-confluence'){ if(ui.run&&ui.run.active) return; var cd={id:'d'+Date.now(),title:'Reporting Manager requirements (Confluence page)',url:'',by:'Confluence Agent',date:'2026-10-19'}; S.reqDocs=S.reqDocs||[]; S.reqDocs.unshift(cd); ui.open.req=true; save(); renderArtifacts(); proposeReqMilestone(cd,true).then(scrollToMonitor); }
    else if(act==='goto-links'){ ui.open.prototype=true; renderArtifacts(); var t2=$('#art-prototype'); if(t2) t2.scrollIntoView({block:'center'}); }
    else if(act==='lock'&&can.control()){ S.protoLocked=!S.protoLocked; logEntry({kind:'lock',title:S.protoLocked?'Prototype locked for review':'Prototype unlocked',note:'',effects:[]}); save(); renderArtifacts(); }
    else if(act==='req-done'){ if(can.approve()&&!S.reqDone){ S.reqDone=true; var bb=S.progress; S.progress=Math.max(S.progress,50); logEntry({kind:'reqdone',title:'Requirements marked done',note:'',effects:['Progress '+bb+'% to '+S.progress+'%']}); save(); renderAll(); } }
    else if(act==='reset'){ if(can.approve()){ try{ localStorage.removeItem(KEY); }catch(x){} var keep=G.persona; G=seed(); G.persona=keep; S=G.projects[G.current]; ui.fresh={}; ui.drafts={}; ui.run=null; ui.expanded=null; renderAll(); toast('All sample data restored.'); } }
    else if(act==='n8n-clear'){ nsave({}); ui.nstatus='Disconnected.'; renderAll(); }
    else if(act==='n8n-sync'){ nSync(); }
    else if(act==='n8n-retry'){ var rt=S.items.find(function(i){return i.key===key}); if(rt) nDecision(rt,rt.status); }
    else if(act==='n8n-test'){ nTest(); }
    else if(act==='import-toggle'){ ui.importOpen=!ui.importOpen; renderMonitor(); }
    else if(act==='import-go'){ importRows(); }
  });
  document.addEventListener('keydown',function(e){ if(e.key!=='Escape') return; if(ui.cardOpen){ closeCard(); } else if(ui.drawerOpen){ ui.drawerOpen=false; renderDrawer(); renderNav(); var sb=$('#set-btn'); if(sb) sb.focus(); } else if(ui.menuOpen){ ui.menuOpen=false; renderNav(); } });
  document.addEventListener('input',function(e){
    var k=e.target.dataset&&e.target.dataset.draft; if(!k) return;
    ui.drafts[k]=e.target.value;
    if(k.indexOf('note:')===0){ var box=e.target.closest('.decision'); if(box) box.querySelectorAll('[data-decide]').forEach(function(b){ b.disabled=!e.target.value.trim(); }); }
  });
  document.addEventListener('change',function(e){ var fk=e.target.dataset&&e.target.dataset.files; if(fk){ ui.drafts[fk]=Array.prototype.map.call(e.target.files||[],function(f){return f.name}); renderModal(); return; }
    var k=e.target.dataset&&e.target.dataset.draft; if(k&&e.target.tagName==='SELECT') ui.drafts[k]=e.target.value; });
  document.addEventListener('submit',async function(e){
    var f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
    var kind=f.dataset.form, D=ui.drafts;
    if(kind==='invite'){
      if(!can.invite()||!D.invEmail) return;
      S.stakeholders.push({name:D.invEmail,role:D.invRole||'dev'}); logEntry({kind:'invite',title:'Invited '+D.invEmail+' as '+PERSONAS[D.invRole||'dev'],note:'Invite recorded. Email sending is not connected in this prototype.',effects:[]});
      D.invEmail=''; save(); renderAll(); toast('Invite recorded.');
    } else if(kind==='notes'){
      if(!D.mnText||D.mnText.trim().length<20) { toast('Add the notes or transcript first.'); return; }
      var id='n'+Date.now(), note={id:id,title:D.mnTitle||'Meeting notes',date:D.mnDate||'2026-10-16',by:personaName(),status:'processing',text:D.mnText};
      S.notes.unshift(note); var snap={title:note.title,date:note.date,text:note.text}; D.mnTitle='';D.mnText='';
      renderArtifacts();
      var keys=await runAgent({source:'Meeting Notes',title:snap.title,date:snap.date,by:personaName(),text:snap.text,type:'requirement_change'});
      note.status=keys?'processed':'not processed'; save(); renderArtifacts(); scrollToMonitor();
    } else if(kind==='card'){
      if(!D.fcBody||!D.fcBody.trim()) return;
      if(ui.run&&ui.run.active){ toast('The agents are still working. Try again in a moment.'); return; }
      var loom=(D.fcLoom||'').trim(); if(loom&&!/^https:\/\//.test(loom)){ toast('The Loom link should start with https://'); return; }
      if(ui.editingCard){
        var ec2=S.cards.find(function(x){return x.id===ui.editingCard});
        if(!ec2||!canEditCard(ec2)){ toast('This card can no longer be edited.'); closeCard(); renderArtifacts(); return; }
        ec2.audience=D.fcAud||'internal'; ec2.body=D.fcBody.trim(); ec2.clients=(D.fcClients||'').trim(); ec2.loom=loom; ec2.files=(D.fcFiles||[]).slice(); ec2.edited='2026-10-16';
        ui.fbTab=ec2.audience; ui.open.feedback=true;
        var etxt=ec2.body+(ec2.clients?'\nClients: '+ec2.clients:'')+(loom?'\nLoom video: '+loom:'')+(ec2.files.length?'\nAttachments: '+ec2.files.join(', '):'');
        var hasPending=S.items.some(function(x){return x.cardId===ec2.id&&x.status==='pending'});
        var eid=ec2.id, ebody=ec2.body, ecl=ec2.clients;
        closeCard(); save(); renderArtifacts();
        if(hasPending){ await runAgent({source:'Feedback Card',title:ebody.slice(0,60),date:'2026-10-16',by:personaName(),text:etxt,clients:ecl,type:'feedback',cardId:eid}); scrollToMonitor(); }
        else { toast('Card updated.'); }
        return;
      }
      var aud=D.fcAud||'internal', cid='c'+Date.now(), body=D.fcBody.trim(), cl=(D.fcClients||'').trim(), fl=D.fcFiles||[];
      S.cards.unshift({id:cid,owner:G.persona,audience:aud,by:personaName(),date:'2026-10-16',clients:cl,body:body,loom:loom,files:fl}); ui.fbTab=aud; ui.open.feedback=true;
      var txt=body+(cl?'\nClients: '+cl:'')+(loom?'\nLoom video: '+loom:'')+(fl.length?'\nAttachments: '+fl.join(', '):'');
      D.fcBody='';D.fcClients='';D.fcLoom='';D.fcFiles=[]; ui.cardOpen=false; save(); renderModal(); renderArtifacts();
      await runAgent({source:'Feedback Card',title:body.slice(0,60),date:'2026-10-16',by:personaName(),text:txt,clients:cl,type:'feedback',cardId:cid}); scrollToMonitor();
    } else if(kind==='n8n'){
      if(!can.approve()) return;
      var nb=(D.nBase!==undefined?D.nBase:ncfg().base||'').trim().replace(/\/+$/,''), nk=(D.nKey!==undefined?D.nKey:ncfg().key||'').trim();
      if(nb&&!nok(nb)){ ui.nstatus='The URL must start with https:// (http://localhost is also fine for a local n8n).'; renderDrawer(); return; }
      nsave({base:nb,key:nk}); ui.nstatus=nb?'Saved. Use Test connection, then Sync from n8n in the Status Monitor.':'Saved, but a base URL is needed to connect.'; renderAll();
    } else if(kind==='reqdoc'){
      var rt=(D.rdTitle||'').trim(), ru=(D.rdUrl||'').trim(); if(!rt) return;
      if(ru&&!/^https:\/\//.test(ru)){ toast('Link must start with https://'); return; }
      S.reqDocs=S.reqDocs||[]; var doc={id:'d'+Date.now(),title:rt,url:ru,by:personaName(),date:'2026-10-19'}; S.reqDocs.unshift(doc);
      D.rdTitle='';D.rdUrl=''; ui.open.req=true; save(); renderArtifacts();
      if(can.approve()){ applyReqDraft(doc); scrollToMonitor(); } else { await proposeReqMilestone(doc); scrollToMonitor(); }
    } else if(kind==='links'){
      if(!can.control()) return;
      var lp=(D.lkProto!==undefined?D.lkProto:((S.links||{}).prototype||'')).trim(), lm=(D.lkMiro!==undefined?D.lkMiro:((S.links||{}).miro||'')).trim();
      if((lp&&!/^https:\/\//.test(lp))||(lm&&!/^https:\/\//.test(lm))){ toast('Links must start with https://'); return; }
      S.links={prototype:lp,miro:lm}; delete D.lkProto; delete D.lkMiro; save(); renderProject(); renderArtifacts(); toast('Links saved.');
    } else if(kind==='proto'){
      if(!D.pfBody||!D.pfBody.trim()) return;
      var pb=D.pfBody.trim(); S.protoComments.unshift({id:'p'+Date.now(),by:personaName(),date:'2026-10-16',clients:'',body:pb}); D.pfBody='';
      renderArtifacts();
      await runAgent({source:'Prototype Feedback',title:pb.slice(0,60),date:'2026-10-16',by:personaName(),text:pb,type:'comment'}); scrollToMonitor();
    }
  });
  function importRows(rowsIn,label,quiet){
    var raw=ui.drafts.import||''; var rows;
    if(rowsIn) rows=rowsIn; else try{ rows=JSON.parse(raw); if(!Array.isArray(rows)) rows=rows.data||rows.rows||[]; }catch(err){ toast('That is not valid JSON. Paste the rows exactly as exported.'); return; }
    var n=0, types=['blocker','requirement_change','feedback','comment','milestone'];
    rows.forEach(function(r){
      if(!r||!r.item_key||S.items.some(function(i){return i.key===r.item_key})) return;
      var pts=String(r.key_points||'').split('\n').map(function(s){return s.replace(/^\s*-\s*/,'').trim()}).filter(Boolean);
      var src=String(r.source||'Meeting Notes'); var st=['pending','accepted','rejected','delayed'].indexOf(r.status)>-1?r.status:'pending';
      S.items.unshift({key:r.item_key,project_key:r.project_key||'SCRUM',title:r.title||r.item_key,source:src,by:r.submitted_by||'n8n',date:String(r.source_date||'').slice(0,10)||'2026-10-16',
        type:types.indexOf(r.item_type)>-1?r.item_type:(src==='Feedback Card'?'feedback':(src==='Meeting Notes'?'requirement_change':'comment')),
        priority:['high','medium','low'].indexOf(r.priority)>-1?r.priority:'medium',points:pts.length?pts:['(no key points)'],raw:r.raw_text||'',
        affected:String(r.affected_sections||'').split(',').map(function(s){return s.trim()}).filter(function(s){return SECTIONS.indexOf(s)>-1}),
        change:r.proposed_change||'',impact:r.impact||'',reason:r.attention_reason||'',clients:'',cardId:((String(r.source_ref||'').match(/launchpad-card:([^;\s]+)/)||[])[1]||undefined),status:st,created:new Date().toISOString()});
      ui.fresh[r.item_key]=true; n++;
    });
    if(n){ logEntry({kind:'import',title:(label==='n8n sync'?'Synced ':'Imported ')+plural(n,'item')+' from the n8n Action Items table',note:'',effects:[]}); ui.drafts.import=''; ui.importOpen=false; save(); renderAll(); if(quiet!=='silent') toast(plural(n,'item')+' added to the queue.'); }
    else if(quiet!=='silent'&&!quiet) toast('No new rows found. Rows need an item_key that is not already on the page.');
    else if(quiet!=='silent') toast('Already up to date. No new pending items in n8n.');
    return n;
  }

  renderAll();
})();
